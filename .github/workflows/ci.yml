name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Syntax, regression and structure tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check production JavaScript syntax
        run: |
          node --check app.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full test suite
        run: node --test tests/*.test.mjs
