<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0f12">
  <meta name="description" content="FAILED Calculator — a calculator that discovers mathematics, builds memory, and slowly forgets it.">
  <title>FAILED Calculator — dementia build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="titlebar">
    <strong>FAILED_CALCULATOR.EXE — dementia build 1.0</strong>
    <div class="title-actions">
      <div class="lang-switch" aria-label="Language">
        <button id="langRu">RU</button><span>/</span><button id="langEn">EN</button>
      </div>
      <div class="window-buttons" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </header>

  <section class="hero">
    <div class="brand">
      <div class="kicker" data-i18n="kicker"></div>
      <h1>FAILED <span>CALCULATOR</span></h1>
      <p data-i18n="hero"></p>
    </div>
    <aside class="brain">
      <div class="brain-row"><span data-i18n="status"></span><b id="brainState"></b></div>
      <div class="brain-row"><span data-i18n="memoryHealth"></span><b id="brainHealth">100%</b></div>
      <div class="brain-row"><span data-i18n="knownConcepts"></span><b id="knownConcepts">0</b></div>
      <div class="brain-row"><span data-i18n="nextEpisode"></span><b id="decayCountdown">--:--</b></div>
      <div class="health-track"><div class="health-fill" id="healthFill"></div></div>
    </aside>
  </section>

  <nav class="tabs">
    <button class="active" data-tab="calculator" data-i18n="tabCalculator"></button>
    <button data-tab="memory" data-i18n="tabMemory"></button>
    <button data-tab="charts" data-i18n="tabCharts"></button>
    <button data-tab="observer" data-i18n="tabObserver"></button>
    <button data-tab="dementia" data-i18n="tabDementia"></button>
    <button data-tab="about" data-i18n="tabAbout"></button>
  </nav>

  <main>
    <section id="calculator" class="tab active">
      <div class="calculator-grid">
        <article class="card">
          <h2 data-i18n="experienceTitle"></h2>
          <div class="expression-row">
            <input id="expression" autocomplete="off" spellcheck="false" data-i18n-placeholder="expressionPlaceholder">
            <button id="calculate" class="primary" data-i18n="thinkButton"></button>
          </div>

          <div class="examples">
            <span data-i18n="tryExamples"></span>
            <button data-expr="2+2">2+2</button>
            <button data-expr="7*8">7*8</button>
            <button data-expr="2+5i">2+5i</button>
            <button data-expr="sqrt(-1)">sqrt(-1)</button>
            <button data-expr="sin(pi/2)">sin(pi/2)</button>
            <button data-expr="(2+3i)*(4-i)">(2+3i)*(4-i)</button>
            <button data-expr="12!">12!</button>
          </div>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress"><div id="progressBar"></div></div>
            <div class="progress-label" id="progressLabel"></div>
          </div>

          <div class="thinking" id="thinking">
            <div class="thinking-placeholder" data-i18n="thinkingPlaceholder"></div>
          </div>
          <div class="result" id="result"></div>
        </article>

        <aside class="card concepts-card">
          <h2 data-i18n="rememberTitle"></h2>
          <div id="conceptList" class="concept-list"></div>
        </aside>
      </div>
    </section>

    <section id="memory" class="tab">
      <article class="card">
        <div class="memory-header">
          <div>
            <h2 data-i18n="internalMemory"></h2>
            <p class="muted" data-i18n="memorySubtitle"></p>
          </div>
          <select id="memoryConcept"></select>
        </div>
        <div id="memorySummary" class="memory-summary"></div>
        <div id="memoryTableWrap" class="memory-table-wrap"></div>
        <div id="episodeList" class="episode-list"></div>
      </article>
    </section>

    <section id="charts" class="tab">
      <article class="card">
        <h2 data-i18n="chartsTitle"></h2>
        <p class="muted" data-i18n="chartsSubtitle"></p>
        <div class="chart-grid">
          <div class="chart-card"><h3 data-i18n="chartHealth"></h3><canvas id="healthChart" width="720" height="240"></canvas></div>
          <div class="chart-card"><h3 data-i18n="chartKnowledge"></h3><canvas id="knowledgeChart" width="720" height="240"></canvas></div>
          <div class="chart-card"><h3 data-i18n="chartConcepts"></h3><canvas id="conceptChart" width="720" height="240"></canvas></div>
          <div class="chart-card"><h3 data-i18n="chartDecay"></h3><canvas id="decayChart" width="720" height="240"></canvas></div>
        </div>
      </article>
    </section>

    <section id="observer" class="tab">
      <article class="card">
        <h2 data-i18n="observerTitle"></h2>
        <p class="muted" data-i18n="observerSubtitle"></p>
        <div id="observerLog" class="log"></div>
      </article>
    </section>

    <section id="dementia" class="tab">
      <article class="card">
        <h2 data-i18n="dementiaTitle"></h2>
        <div class="settings-grid">
          <label class="setting">
            <span data-i18n="decayInterval"></span> <b id="decayIntervalLabel"></b>
            <small data-i18n="decayHelp"></small>
            <input id="decayInterval" type="range" min="12" max="180" step="3">
          </label>
          <div class="dementia-actions">
            <button id="damageBrain" class="warning" data-i18n="triggerEpisode"></button>
            <button id="resetBrain" class="danger" data-i18n="lobotomy"></button>
          </div>
        </div>
        <div class="stage-panel">
          <div><span data-i18n="currentStage"></span><b id="stageName"></b></div>
          <p id="stageDescription"></p>
        </div>
      </article>
    </section>

    <section id="about" class="tab">
      <article class="card about">
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
        <p data-i18n="aboutP3"></p>
        <pre class="syntax">+  -  *  /  %  ^  !
( )
2i   2pi   2(3+4)
pi   e   i
sqrt(x)  abs(x)
sin(x)   cos(x)   tan(x)
ln(x)    log(x)   exp(x)</pre>
        <p data-i18n="aboutP4"></p>
      </article>
    </section>
  </main>

  <footer class="footer">
    <span>FAILED Calculator / dementia build 1.0</span>
    <span data-i18n="footer"></span>
  </footer>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
